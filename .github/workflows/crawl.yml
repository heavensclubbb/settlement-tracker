name: crawl-settlements
on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python crawl_settlements.py
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SCRAPERAPI_KEY: ${{ secrets.SCRAPERAPI_KEY }}
      - run: |
          git config user.name "settlement-bot"
          git config user.email "bot@users.noreply.github.com"
          git add settlements.json crawl_state.json
          git diff --staged --quiet || git commit -m "update settlements"
          git push
